<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker De Game</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .landing {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }
        .landing-card {
            background: rgba(0, 0, 0, 0.55);
            border: 2px solid #5a3a1a;
            border-radius: 18px;
            padding: 2.5rem 2.2rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.7);
        }
        .card-suits {
            font-size: 1.6rem;
            text-align: center;
            margin-bottom: 0.2rem;
            letter-spacing: 6px;
        }
        .card-suits .red { color: #e05050; }
        .landing h1 {
            color: #e0b94c;
            font-size: 2rem;
            text-align: center;
            margin: 0.2rem 0 0.3rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            letter-spacing: 1px;
        }
        .tagline {
            color: #90b890;
            text-align: center;
            margin: 0 0 1.8rem;
            font-size: 0.9rem;
        }
        .field-label {
            display: block;
            color: #e0b94c;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 0.45rem;
        }
        .text-input {
            width: 100%;
            padding: 0.72rem 1rem;
            border-radius: 9px;
            border: 1.5px solid #5a3a1a;
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .text-input:focus { border-color: #e0b94c; }
        .btn-primary {
            width: 100%;
            padding: 0.82rem;
            border-radius: 9px;
            border: none;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 0.9rem;
            transition: opacity 0.15s, transform 0.1s;
            font-family: inherit;
        }
        .btn-primary:hover { opacity: 0.88; }
        .btn-primary:active { transform: scale(0.98); }
        .btn-create { background: #e0b94c; color: #1a1100; }
        .btn-join-action { background: #2e7d52; color: #fff; }
        .divider {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            margin: 1.6rem 0;
        }
        .join-row {
            display: flex;
            gap: 0.6rem;
            align-items: flex-end;
        }
        .join-row .code-wrap { flex: 1; }
        .join-row .btn-join-action {
            width: auto;
            padding: 0.72rem 1.2rem;
            margin-top: 0;
            flex-shrink: 0;
            border-radius: 9px;
        }
        #roomCode {
            text-transform: uppercase;
            letter-spacing: 5px;
            font-size: 1.1rem;
            font-weight: 600;
        }
        .error-msg {
            color: #ff7070;
            font-size: 0.88rem;
            margin-top: 0.6rem;
            min-height: 1.3em;
            text-align: center;
        }
        .coins-note {
            text-align: center;
            color: #80a880;
            font-size: 0.8rem;
            margin-top: 1.2rem;
        }
        select.text-input option {
            background: #1a3025;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="landing">
        <div class="landing-card">
            <div class="card-suits">
                <span>♠</span>
                <span class="red">♥</span>
                <span class="red">♦</span>
                <span>♣</span>
            </div>
            <h1>Poker De Game</h1>
            <p class="tagline">Texas Hold'em with friends · No signup needed</p>

            <label class="field-label" for="playerName">Your Name</label>
            <input class="text-input" type="text" id="playerName"
                   placeholder="Enter your name..." maxlength="16" autocomplete="off">

            <label class="field-label" for="maxPlayers" style="margin-top:1rem;">Table Size</label>
            <select class="text-input" id="maxPlayers" style="cursor:pointer;">
                <option value="2">2 players</option>
                <option value="3">3 players</option>
                <option value="4">4 players</option>
                <option value="5">5 players</option>
                <option value="6" selected>6 players (max)</option>
            </select>

            <button class="btn-primary btn-create" id="createBtn">Create New Game</button>

            <hr class="divider">

            <label class="field-label">Join with Room Code</label>
            <div class="join-row">
                <div class="code-wrap">
                    <input class="text-input" type="text" id="roomCode"
                           placeholder="XXXXXX" maxlength="6" autocomplete="off">
                </div>
                <button class="btn-join-action" id="joinBtn">Join</button>
            </div>

            <div class="error-msg" id="errorMsg"></div>

            <p class="coins-note">Each player starts with 1,000 coins · Up to 6 players</p>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="/static/js/index.js"></script>
</body>
</html>
